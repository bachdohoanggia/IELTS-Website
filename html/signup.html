<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <!-- <script type="module" src="../js/validation.js" defer></script>  -->
    <title>Signup</title>
</head>
<body>
    <div class="wrapper">
        <h1>Sign up</h1>
        <p id="error-message"></p>
        <form id="form">
            <div>
                <label for="firstname-input">
                    <img id="img" src="PNG/Person.png">
                </label>
                <input type="text" name="firstname" id="firstname-input" placeholder="Username">
            </div>
            <div>
                <label for="email-input">
                    <span>@</span>
                </label>
                <input type="email" name="email" id="email-input" placeholder="Email">
            </div>
            <div>
                <label for="password-input">
                    <img id="img" src="PNG/Lock.png">
                </label>
                <input type="password" name="password" id="password-input" placeholder="Password">
            </div>
            <div>
                <label for="repeat-password-input">
                    <img id="img" src="PNG/Lock.png">
                </label>
                <input type="password" name="repeat-password" id="repeat-password-input" placeholder="Repeat password">
            </div>
            <div>
                <label for="role-select">
                    <img id="img" src="PNG/Person.png">
                </label>
                <select id="role-select" name="role" required>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>
            <button type="submit">Sign up</button>
        </form>
        <p>Already have an Account? <a href="index.html">Login</a></p>
    </div>

    <div id="teacherCodePinModalOverlay" class="teacher-code-pin-modal-overlay hidden">
        <div class="teacher-code-pin-modal-content">
            <h3 class="teacher-code-pin-modal-title">Enter teacher code</h3>
            <div class="pin-input-container" id="pinInputContainer">
                <input type="text" maxlength="1" class="pin-input-box" data-pin-index="0">
                <input type="text" maxlength="1" class="pin-input-box" data-pin-index="1">
                <input type="text" maxlength="1" class="pin-input-box" data-pin-index="2">
                <input type="text" maxlength="1" class="pin-input-box" data-pin-index="3">
                <input type="text" maxlength="1" class="pin-input-box" data-pin-index="4">
                <input type="text" maxlength="1" class="pin-input-box" data-pin-index="5">
            </div>
            <p class="teacher-code-pin-error-message hidden" id="teacherCodePinModalError">Incorrect teacher code.</p>
            <div class="teacher-code-pin-modal-actions">
                <button id="teacherCodePinModalCancelBtn" class="teacher-code-pin-modal-cancel-button">Cancel</button>
                <button id="teacherCodePinModalSubmitBtn" class="teacher-code-pin-modal-submit-button">Confirm</button>
            </div>
        </div>
    </div>

    <script src="../js/popup.js"></script>
    <script type="module" src="../js/validation.js" defer></script> 

</body>
</html>
